<style>
  :root {
    --bg: #eaf5ff;
    --bg-soft: #f3f9ff;
    --card: #ffffff;
    --line: #c9dcf0;
    --text: #1d3652;
    --muted: #5a7490;
    --lamp: #2b7bd6;
    --lamp-soft: rgba(43, 123, 214, .10);
    --body-text: #34506e;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; scroll-padding-top: 70px; }
  body {
    margin: 0;
    background:
      radial-gradient(260px 70px at 14% 120px, rgba(255,255,255,.95), transparent 70%),
      radial-gradient(340px 90px at 82% 210px, rgba(255,255,255,.85), transparent 70%),
      radial-gradient(220px 60px at 62% 70px, rgba(255,255,255,.8), transparent 70%),
      linear-gradient(180deg, #a9d6ff 0, #d3eaff 360px, var(--bg) 700px);
    background-color: var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", "Malgun Gothic", "맑은 고딕", -apple-system, sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  body.modal-open { overflow: hidden; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 0 20px; }
  button { font: inherit; color: inherit; }

  /* ----- 상단 ----- */
  header { padding: 72px 0 26px; text-align: center; }
  .eyebrow { font-size: 12px; letter-spacing: .28em; color: var(--lamp); margin-bottom: 14px; }
  h1 {
    margin: 0 0 14px;
    font-family: "Noto Serif KR", serif;
    font-size: clamp(36px, 8vw, 60px);
    line-height: 1.2;
    letter-spacing: -.01em;
  }
  .tagline { margin: 0 auto; max-width: 560px; color: var(--text); font-size: 17px; }
  .tone { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 22px; }
  .chip {
    padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px;
    color: var(--muted); font-size: 12.5px; background: var(--bg-soft);
  }

  /* ----- 상단 메뉴 ----- */
  nav.menu {
    position: sticky; top: 0; z-index: 20;
    background: rgba(234, 245, 255, .88);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  nav.menu .wrap { display: flex; gap: 8px; justify-content: center; padding-top: 10px; padding-bottom: 10px; overflow-x: auto; }
  nav.menu a {
    flex: none; padding: 6px 16px; border-radius: 999px;
    color: var(--muted); text-decoration: none; font-size: 14px; border: 1px solid transparent;
    transition: color .15s, border-color .15s, background .15s;
  }
  nav.menu a:hover { color: var(--lamp); border-color: var(--line); background: var(--bg-soft); }

  /* ----- 공통 섹션 ----- */
  section { padding: 38px 0 12px; }
  h2 {
    font-family: "Noto Serif KR", serif;
    font-size: 24px; margin: 0 0 18px;
    display: flex; align-items: center; gap: 12px;
  }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .section-hint { margin: -8px 0 18px; color: var(--muted); font-size: 14px; }

  .about p { margin: 0 0 14px; color: var(--body-text); }
  .manager {
    margin-top: 22px; padding: 18px 20px;
    border-left: 3px solid var(--lamp);
    background: var(--lamp-soft);
    border-radius: 0 12px 12px 0;
  }
  .manager b { display: block; margin-bottom: 4px; color: var(--lamp); }
  .manager span { color: var(--body-text); font-size: 15px; }

  /* ----- 해온빌라 장면 ----- */
  .scene {
    position: relative; max-width: 760px; margin: 0 auto;
    padding: 70px 8% 34px; overflow: hidden; isolation: isolate;
    border: 1px solid var(--line); border-radius: 22px;
    box-shadow: 0 18px 44px rgba(40,90,150,.28);
  }
  .sky {
    position: absolute; inset: 0; z-index: 0;
    background:
      radial-gradient(circle at 85% 12%, #fffbe0 0 14px, rgba(255,246,196,.55) 15px 34px, transparent 36px),
      radial-gradient(90px 26px at 22% 14%, rgba(255,255,255,.92), transparent 72%),
      radial-gradient(130px 32px at 50% 8%, rgba(255,255,255,.8), transparent 72%),
      radial-gradient(100px 28px at 72% 24%, rgba(255,255,255,.85), transparent 72%),
      linear-gradient(180deg, #4f9be6 0%, #86c2f5 38%, #bfe2fb 70%, #e4f4ff 100%);
  }
  .nb {
    position: absolute; bottom: 34px; z-index: 1; width: 11%;
    background-color: #9db8d3; border-radius: 4px 4px 0 0;
    background-image: radial-gradient(circle, rgba(255,255,255,.75) 0 2px, transparent 3px);
    background-size: 15px 20px; background-position: 4px 6px;
  }
  .nb.l1 { left: 0; height: 42%; } .nb.l2 { left: 6%; height: 30%; width: 9%; }
  .nb.r1 { right: 0; height: 52%; } .nb.r2 { right: 7%; height: 34%; width: 8%; }
  .lamp { position: absolute; left: 3.4%; bottom: 34px; width: 4px; height: 36%; background: #4a5a6b; z-index: 3; pointer-events: none; }
  .lamp::before { content: ""; position: absolute; top: -3px; left: -9px; width: 22px; height: 7px; border-radius: 10px 10px 2px 2px; background: #4a5a6b; }
  .lamp::after {
    content: ""; position: absolute; top: -34px; left: -72px; width: 148px; height: 160px;
    background: none;
  }

  .villa {
    position: relative; z-index: 2;
    background:
      repeating-linear-gradient(0deg, rgba(60,20,10,.10) 0 1px, transparent 1px 9px),
      repeating-linear-gradient(90deg, rgba(60,20,10,.06) 0 1px, transparent 1px 22px),
      linear-gradient(180deg, #c06c50 0%, #a95a42 100%);
    padding: 20px 16px 0;
    box-shadow: 0 10px 40px rgba(30,60,100,.35);
  }
  .roof { position: absolute; top: -14px; left: -9px; right: -9px; height: 14px; background: #7a5547; border-radius: 4px 4px 0 0; }
  .rail { position: absolute; top: -28px; left: -5px; right: -5px; height: 14px; border-top: 3px solid #e8e2da;
          background: repeating-linear-gradient(90deg, #e8e2da 0 3px, transparent 3px 16px); }
  .lights { position: absolute; left: -9px; right: -9px; top: -46px; width: calc(100% + 18px); height: auto; z-index: 3; pointer-events: none; }

  .vrow { position: relative; padding: 20px 0 18px; }
  .vrow::after { content: ""; position: absolute; left: -16px; right: -16px; bottom: 0; height: 8px; background: #d9d3ca; box-shadow: 0 3px 4px rgba(60,20,10,.25); }
  .vlabel { position: absolute; left: 0; top: 3px; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: rgba(255,255,255,.95); text-shadow: 0 1px 2px rgba(60,20,10,.45); }
  .vcells { display: grid; grid-template-columns: repeat(var(--cols, 3), 1fr); gap: 14px; }

  .cell { position: relative; display: flex; flex-direction: column; align-items: center; }
  .win {
    position: relative; display: block; width: 100%; aspect-ratio: 3 / 4; padding: 0; cursor: pointer; overflow: hidden;
    border: 7px solid #4a5563; border-radius: 3px 3px 0 0;
    background:
      linear-gradient(90deg, rgba(120,150,190,.35) 0 13%, transparent 30% 70%, rgba(120,150,190,.35) 87% 100%),
      linear-gradient(115deg, rgba(255,255,255,.2) 0 16%, transparent 17%),
      radial-gradient(120% 95% at 50% 100%, var(--g1, #ffe2b0), var(--g2, #f0a95a));
    box-shadow: 0 2px 10px rgba(40,20,10,.25), inset 0 0 14px rgba(0,0,0,.22);
    transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
    animation: breathe 5s ease-in-out infinite;
  }
  .cell:nth-child(2) .win { animation-delay: -1.7s; }
  .cell:nth-child(3) .win { animation-delay: -3.2s; }
  .win::before, .win::after { content: ""; position: absolute; background: rgba(74,85,99,.9); z-index: 2; }
  .win::before { left: 50%; top: 0; bottom: 0; width: 4px; transform: translateX(-50%); }
  .win::after { left: 0; right: 0; top: 38%; height: 4px; }
  .win-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; z-index: 1; }
  .win:hover, .win:focus-visible {
    transform: translateY(-3px); filter: brightness(1.14); outline: none;
    box-shadow: 0 6px 22px color-mix(in srgb, var(--g2, #f0a95a) 70%, transparent), inset 0 0 12px rgba(0,0,0,.2);
  }
  .sill { width: 112%; height: 8px; margin-top: -1px; background: #d9d3ca; border-radius: 2px; box-shadow: 0 4px 5px rgba(60,20,10,.3); }
  .nameplate {
    margin-top: 9px; padding: 1px 9px; font-size: 12px; font-weight: 700; white-space: nowrap;
    color: #2a1d0c; background: linear-gradient(180deg, #f0c27d, #c98f43); border-radius: 3px;
  }
  .tip {
    position: absolute; top: 0; z-index: 12; width: max-content; max-width: 210px; padding: 7px 12px;
    background: #fff6e6; color: #3a2a18; font-size: 12.5px; line-height: 1.5; border-radius: 12px;
    box-shadow: 0 8px 20px rgba(30,60,100,.35); opacity: 0; pointer-events: none;
    translate: 0 4px; transition: opacity .16s ease, translate .16s ease;
  }
  .cell[data-pos="c"] .tip { left: 50%; transform: translate(-50%, calc(-100% - 10px)); }
  .cell[data-pos="l"] .tip { left: 0; transform: translateY(calc(-100% - 10px)); }
  .cell[data-pos="r"] .tip { right: 0; transform: translateY(calc(-100% - 10px)); }
  .win:hover + .tip, .win:focus-visible + .tip { opacity: 1; translate: 0 0; }

  .ground { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 14px; align-items: end; padding-top: 22px; }
  .gcell { display: flex; flex-direction: column; align-items: center; }
  .sign { padding: 1px 10px; margin-bottom: 8px; font-size: 12px; font-weight: 700; letter-spacing: .06em; color: #2a1d0c;
          background: linear-gradient(180deg, #f0c27d, #c98f43); border-radius: 3px; white-space: nowrap; }
  .office-win {
    width: 100%; aspect-ratio: 4 / 3; border: 6px solid #4a5563; border-radius: 3px 3px 0 0; position: relative;
    background:
      linear-gradient(115deg, rgba(255,255,255,.35) 0 18%, transparent 19%),
      radial-gradient(110% 90% at 30% 100%, #fff1d0, #f2b96a);
    box-shadow: 0 2px 10px rgba(40,20,10,.25), inset 0 0 14px rgba(0,0,0,.2);
  }
  .office-win::after { content: ""; position: absolute; left: 0; right: 0; top: 40%; height: 4px; background: rgba(74,85,99,.9); }
  .door-wrap { position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; }
  .porch { width: 14px; height: 14px; border-radius: 50%; margin-bottom: 6px; background: radial-gradient(circle, #fff3c9 0 35%, rgba(255,210,130,.0) 70%); box-shadow: 0 0 14px 5px rgba(255,236,170,.6); }
  .door {
    position: relative; width: 78%; aspect-ratio: 2 / 3; border: 5px solid #4a5563; border-bottom: 0;
    border-radius: 999px 999px 0 0 / 70px 70px 0 0;
    background: linear-gradient(90deg, #6f8296, #8ea3b8 48%, #6f8296);
  }
  .door::before { content: ""; position: absolute; left: 22%; right: 22%; top: 14%; height: 22%; border-radius: 40px 40px 4px 4px; background: radial-gradient(#e9f5ff, #9cc4e6); box-shadow: inset 0 0 8px rgba(0,0,0,.25); }
  .door::after { content: ""; position: absolute; right: 14%; top: 56%; width: 7px; height: 7px; border-radius: 50%; background: #e9be72; }
  .mailcell { align-items: stretch; }
  .mailtitle { align-self: center; font-size: 11px; letter-spacing: .16em; color: rgba(255,255,255,.95); text-shadow: 0 1px 2px rgba(60,20,10,.45); margin-bottom: 5px; }
  .mailboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 5px; background: #5b6674; border-radius: 4px; }
  .mailbox {
    aspect-ratio: 4 / 3; padding: 0; border: 0; border-radius: 2px; cursor: pointer; font-size: 10px; font-weight: 700; color: #2c2c2c;
    background: linear-gradient(180deg, #cfc7b8, #9d968a); transition: filter .15s, box-shadow .15s;
  }
  .mailbox:hover { filter: brightness(1.15); box-shadow: 0 0 10px rgba(255,255,255,.8); }
  .bins { display: flex; justify-content: center; gap: 6px; margin-top: 10px; align-items: flex-end; }
  .bin { width: 22%; max-width: 34px; aspect-ratio: 3 / 4; border-radius: 3px 3px 2px 2px; position: relative; }
  .bin::before { content: ""; position: absolute; left: -2px; right: -2px; top: -4px; height: 5px; border-radius: 2px; background: rgba(0,0,0,.35); }
  .bin.b1 { background: #3f6b52; } .bin.b2 { background: #3b5c88; } .bin.b3 { background: #8a6a2e; }
  .binlabel { text-align: center; font-size: 10.5px; color: rgba(255,255,255,.92); text-shadow: 0 1px 2px rgba(60,20,10,.45); margin-top: 5px; }
  .street { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; height: 34px; background: linear-gradient(#7c8593, #616977); border-top: 3px solid #d9d3ca; }

  /* ----- 공통 이벤트 ----- */
  .events { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .event {
    padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card);
  }
  .event .n { font-size: 11px; letter-spacing: .14em; color: var(--lamp); }
  .event .t { font-weight: 700; margin-top: 2px; }
  .event .s { font-size: 13px; color: var(--muted); }

  /* ----- 버튼 / 푸터 ----- */
  .cta { text-align: center; padding: 34px 0 6px; }
  .cta a {
    display: inline-block; padding: 14px 34px; border-radius: 999px;
    background: var(--lamp); color: #fff; font-weight: 700; text-decoration: none;
    box-shadow: 0 8px 24px rgba(43,123,214,.32); transition: transform .15s ease;
  }
  .cta a:hover { transform: translateY(-2px); }
  footer { padding: 44px 0 60px; text-align: center; color: var(--muted); font-size: 13px; }

  /* ----- 팝업 ----- */
  .modal { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; height: 100vh; height: 100dvh; }
  .modal-backdrop { position: absolute; inset: 0; background: rgba(25, 50, 85, .55); backdrop-filter: blur(3px); animation: fade .18s ease; }
  .modal-panel {
    position: relative; width: min(560px, 100%); max-height: 100%; overflow-y: auto; overscroll-behavior: contain;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    box-shadow: 0 24px 60px rgba(25,50,85,.4); outline: none; animation: pop .2s ease;
  }
  .modal-close {
    position: absolute; top: 10px; right: 10px; z-index: 2; width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--line); background: rgba(255,255,255,.9); color: var(--text); font-size: 20px; line-height: 1; cursor: pointer;
  }
  .modal-close:hover { color: var(--lamp); border-color: var(--lamp); }
  .modal-img { aspect-ratio: 4 / 3; background: #dbe9f7; }
  .modal-img img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; display: block; }
  .modal-body { padding: 22px 24px 26px; }
  .modal-body h3 { font-family: "Noto Serif KR", serif; font-size: 26px; margin: 2px 0 2px; }
  .m-sub { color: var(--muted); font-size: 14px; }
  .m-tag { color: var(--lamp); font-size: 13.5px; margin: 6px 0 18px; }
  .m-sec { padding: 12px 0; border-top: 1px solid var(--line); }
  .m-sec dt { font-size: 12px; letter-spacing: .1em; color: var(--lamp); margin-bottom: 3px; }
  .m-sec dd { margin: 0; color: var(--body-text); font-size: 15px; }
  .bubbles { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; align-items: flex-start; }
  .bubble {
    padding: 8px 14px; border-radius: 14px 14px 14px 4px; background: var(--bg-soft); border: 1px solid var(--line);
    font-size: 14.5px; color: var(--text);
  }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
  @media (max-width: 560px) {
    header { padding-top: 52px; }
    .scene { padding-inline: 6%; }
    .villa { padding: 18px 10px 0; }
    .vrow::after { left: -10px; right: -10px; }
    .vcells { gap: 8px; }
    .win { border-width: 5px; }
    .nameplate { font-size: 10.5px; padding: 1px 6px; }
    .tip { max-width: 150px; font-size: 12px; }
    .ground { gap: 8px; }
    .modal { padding: 12px; }
    .modal-img { aspect-ratio: 1 / 1; }
    .modal-body { padding: 18px 18px 22px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="villaName"></h1>
      <p class="tagline" id="tagline"></p>
      <p class="tone" id="tone"></p>
      <div class="chips" id="chips"></div>
    </header>
  </div>

  <nav class="menu" aria-label="페이지 메뉴">
    <div class="wrap">
      <a href="#about" id="navAbout"></a>
      <a href="#residents" id="navResidents"></a>
      <a href="#events" id="navEvents"></a>
    </div>
  </nav>

  <div class="wrap">
    <section id="about" class="about">
      <h2 id="aboutTitle"></h2>
      <div id="aboutBody"></div>
      <div class="manager" id="manager" hidden></div>
    </section>

    <section id="residents">
      <h2 id="residentsTitle"></h2>
      <p class="section-hint" id="residentsHint"></p>
      <div class="scene" id="scene" aria-label="해온빌라 외관 일러스트">
        <div class="sky"></div>
        <div class="nb l1"></div><div class="nb l2"></div><div class="nb r1"></div><div class="nb r2"></div>
        <div class="lamp"></div>
        <div class="villa" id="villa"></div>
        <div class="street"></div>
      </div>
    </section>

    <section id="events">
      <h2 id="eventsTitle"></h2>
      <p class="section-hint" id="eventsIntro"></p>
      <div class="events" id="eventList"></div>
    </section>

    <div class="cta" id="cta" hidden></div>
    <footer id="footer"></footer>
  </div>

  <div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mName">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" id="modalPanel" tabindex="-1">
      <button class="modal-close" id="modalClose" data-close aria-label="닫기">&times;</button>
      <div class="modal-img" id="mImg" hidden></div>
      <div class="modal-body">
        <span class="plate" id="mPlate"></span>
        <h3 id="mName"></h3>
        <div class="m-sub" id="mSub"></div>
        <div class="m-tag" id="mTag"></div>
        <dl id="mList" style="margin:0"></dl>
      </div>
    </div>
  </div>

<script>
  // 아래는 화면을 그리는 코드입니다. 건드리지 않아도 됩니다.
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // ---------- 머리말 ----------
  document.title = SITE.pageTitle;
  document.getElementById('eyebrow').textContent = SITE.eyebrow;
  document.getElementById('villaName').textContent = SITE.villaName;
  document.getElementById('tagline').textContent = SITE.tagline;
  document.getElementById('tone').textContent = SITE.tone;
  SITE.chips.forEach(c => document.getElementById('chips').appendChild(el('span', 'chip', c)));

  document.getElementById('navAbout').textContent = SITE.aboutTitle;
  document.getElementById('navResidents').textContent = SITE.residentsTitle;
  document.getElementById('navEvents').textContent = SITE.eventsTitle;

  // ---------- 소개 ----------
  document.getElementById('aboutTitle').textContent = SITE.aboutTitle;
  SITE.about.forEach(t => document.getElementById('aboutBody').appendChild(el('p', '', t)));
  if (SITE.manager) {
    const m = document.getElementById('manager');
    m.appendChild(el('b', '', SITE.manager.title));
    m.appendChild(el('span', '', SITE.manager.desc));
    m.hidden = false;
  }

  // ---------- 입주민 ----------
  document.getElementById('residentsTitle').textContent = SITE.residentsTitle;
  document.getElementById('residentsHint').textContent = SITE.residentsHint;

  const villa = document.getElementById('villa');
  const allResidents = [];
  SITE.floors.forEach(f => f.rooms.forEach(r => { if (!r.common) allResidents.push(r); }));

  // 옥상 전구 장식
  function buildLights() {
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 640 36');
    svg.setAttribute('class', 'lights');
    svg.setAttribute('aria-hidden', 'true');
    const segs = 6, w = 640 / segs;
    let d = 'M0 4';
    for (let i = 0; i < segs; i++) d += ' Q ' + (i * w + w / 2) + ' 34 ' + ((i + 1) * w) + ' 4';
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', d); path.setAttribute('fill', 'none');
    path.setAttribute('stroke', '#5a6675'); path.setAttribute('stroke-width', '1.4');
    svg.appendChild(path);
    const cols = ['#ffd27a', '#ff9f7a', '#ffe9a8', '#ffb8d0'];
    let k = 0;
    for (let i = 0; i < segs; i++) {
      const x0 = i * w, x1 = x0 + w / 2, x2 = x0 + w;
      for (let j = 1; j <= 4; j++) {
        const t = j / 5, u = 1 - t;
        const x = u * u * x0 + 2 * u * t * x1 + t * t * x2;
        const y = u * u * 4 + 2 * u * t * 34 + t * t * 4;
        const c = cols[k++ % cols.length];
        [[6, .22], [2.8, 1]].forEach(([r, o]) => {
          const dot = document.createElementNS(NS, 'circle');
          dot.setAttribute('cx', x.toFixed(1)); dot.setAttribute('cy', y.toFixed(1));
          dot.setAttribute('r', r); dot.setAttribute('fill', c); dot.setAttribute('opacity', o);
          svg.appendChild(dot);
        });
      }
    }
    return svg;
  }

  function imgSrc(r) {
    if (r.image) return r.image;
    if (SITE.imageBase) return SITE.imageBase + r.no + '.' + (SITE.imageExt || 'png');
    return '';
  }

  function makeWindow(r, idx, total) {
    const cell = el('div', 'cell');
    cell.dataset.pos = idx === 0 ? 'l' : (idx === total - 1 ? 'r' : 'c');
    const btn = el('button', 'win');
    btn.type = 'button';
    btn.setAttribute('aria-label', r.no + '호 ' + r.name + ' 자세히 보기');
    if (r.glow) { btn.style.setProperty('--g1', r.glow[0]); btn.style.setProperty('--g2', r.glow[1]); }
    const src = SITE.imageInWindow ? imgSrc(r) : '';   // 창문에는 불빛만, 이미지는 눌렀을 때 팝업에서만
    if (src) {
      const img = document.createElement('img');
      img.className = 'win-img'; img.src = src; img.alt = ''; img.loading = 'lazy';
      img.onerror = () => img.remove();   // 파일이 없으면 이미지만 빼고 불빛은 그대로 둡니다
      btn.appendChild(img);
    }
    btn.addEventListener('click', () => openRoom(r, btn));
    cell.appendChild(btn);
    if (r.quotes && r.quotes.length) {
      const tip = el('span', 'tip', '“' + r.quotes[0] + '”');
      tip.setAttribute('aria-hidden', 'true');
      cell.appendChild(tip);
    }
    cell.appendChild(el('div', 'sill'));
    cell.appendChild(el('div', 'nameplate', r.no + ' ' + r.name));
    return cell;
  }

  function renderVilla() {
    villa.innerHTML = '';
    villa.appendChild(el('div', 'roof'));
    villa.appendChild(el('div', 'rail'));
    villa.appendChild(buildLights());

    // 입주민 층 (위층부터)
    SITE.floors.filter(f => !f.common).forEach(floor => {
      const row = el('div', 'vrow');
      row.appendChild(el('div', 'vlabel', floor.label));
      const cells = el('div', 'vcells');
      cells.style.setProperty('--cols', floor.rooms.length);
      floor.rooms.forEach((r, i) => cells.appendChild(makeWindow(r, i, floor.rooms.length)));
      row.appendChild(cells);
      villa.appendChild(row);
    });

    // 1층: 관리실 · 현관 · 우편함/분리수거장
    const groundFloor = SITE.floors.find(f => f.common);
    const office = groundFloor && groundFloor.rooms[0];
    const g = el('div', 'ground');

    const c1 = el('div', 'gcell');
    c1.appendChild(el('div', 'sign', (office && office.plate) || '관리실'));
    const ow = el('div', 'office-win');
    if (office && office.desc) ow.title = office.desc;
    c1.appendChild(ow);
    g.appendChild(c1);

    const c2 = el('div', 'gcell');
    const dw = el('div', 'door-wrap');
    dw.appendChild(el('div', 'porch'));
    dw.appendChild(el('div', 'sign', SITE.villaName));
    dw.appendChild(el('div', 'door'));
    c2.appendChild(dw);
    g.appendChild(c2);

    const c3 = el('div', 'gcell mailcell');
    c3.appendChild(el('div', 'mailtitle', '우편함'));
    const board = el('div', 'mailboard');
    allResidents.slice().sort((a, b) => a.no.localeCompare(b.no)).forEach(r => {
      const m = el('button', 'mailbox', r.no);
      m.type = 'button'; m.title = r.name;
      m.setAttribute('aria-hidden', 'true'); m.tabIndex = -1;
      m.addEventListener('click', () => openRoom(r, null));
      board.appendChild(m);
    });
    c3.appendChild(board);
    const bins = el('div', 'bins');
    ['b1', 'b2', 'b3'].forEach(c => bins.appendChild(el('div', 'bin ' + c)));
    c3.appendChild(bins);
    c3.appendChild(el('div', 'binlabel', '분리수거장'));
    g.appendChild(c3);

    villa.appendChild(g);
  }
  renderVilla();

  // ---------- 팝업 ----------
  const modal = document.getElementById('modal');
  const panel = document.getElementById('modalPanel');
  let lastFocus = null;

  function section(label, text, quotes) {
    const box = el('div', 'm-sec');
    box.appendChild(el('dt', '', label));
    box.appendChild(el('dd', '', text));
    if (quotes && quotes.length) {
      const wrap = el('div', 'bubbles');
      quotes.forEach(q => wrap.appendChild(el('div', 'bubble', '“' + q + '”')));
      box.appendChild(wrap);
    }
    return box;
  }

  function openRoom(r, trigger) {
    lastFocus = trigger || null;
    document.getElementById('mPlate').textContent = r.no + '호';
    document.getElementById('mName').textContent = r.name;
    document.getElementById('mSub').textContent = r.age + '세 · ' + r.job;
    document.getElementById('mTag').textContent = r.tag;

    const imgBox = document.getElementById('mImg');
    imgBox.innerHTML = '';
    const src = imgSrc(r);
    if (src) {
      const img = document.createElement('img');
      img.src = src; img.alt = r.name;
      img.onerror = () => { imgBox.hidden = true; };
      imgBox.appendChild(img);
      imgBox.hidden = false;
    } else {
      imgBox.hidden = true;
    }

    const list = document.getElementById('mList');
    list.innerHTML = '';
    list.appendChild(section('성격', r.personality));
    list.appendChild(section('좋아하는 것', r.likes));
    list.appendChild(section('싫어하는 것', r.dislikes));
    list.appendChild(section('말투', r.speech, r.quotes));

    modal.hidden = false;
    document.body.classList.add('modal-open');
    panel.scrollTop = 0;
    panel.focus();
    try { history.replaceState(null, '', '#room-' + r.no); } catch (e) {}
  }

  function closeRoom() {
    if (modal.hidden) return;
    modal.hidden = true;
    document.body.classList.remove('modal-open');
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    if (lastFocus) lastFocus.focus();
  }

  modal.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeRoom(); });
  document.addEventListener('keydown', e => {
    if (modal.hidden) return;
    if (e.key === 'Escape') closeRoom();
    if (e.key === 'Tab') { e.preventDefault(); document.getElementById('modalClose').focus(); }
  });

  // 주소 끝에 #room-201 이 있으면 바로 그 입주민 팝업을 엽니다.
  (function openFromHash() {
    const m = location.hash.match(/^#room-(\d+)$/);
    if (!m) return;
    const r = allResidents.find(x => x.no === m[1]);
    if (r) openRoom(r, null);
  })();

  // ---------- 공통 이벤트 ----------
  document.getElementById('eventsTitle').textContent = SITE.eventsTitle;
  document.getElementById('eventsIntro').textContent = SITE.eventsIntro;
  SITE.events.forEach((ev, i) => {
    const card = el('div', 'event');
    card.appendChild(el('div', 'n', String(i + 1).padStart(2, '0')));
    card.appendChild(el('div', 't', ev.title));
    if (ev.sub) card.appendChild(el('div', 's', ev.sub));
    document.getElementById('eventList').appendChild(card);
  });

  // ---------- 버튼 / 푸터 ----------
  if (SITE.cta && SITE.cta.link) {
    const c = document.getElementById('cta');
    const a = el('a', '', SITE.cta.label);
    a.href = SITE.cta.link; a.target = '_blank'; a.rel = 'noopener';
    c.appendChild(a);
    c.hidden = false;
  }
  document.getElementById('footer').textContent = SITE.footer;
</script>
</body>
</html>
