<style>
  :root{--bg:#EDF0F4;--paper:#FFFFFF;--ink:#1A2130;--sub:#7D879A;--line:#DCE1E8;--up:#E5334B;--down:#2C66F0;--soft:#EDF0F4;--accent:#1A2130;--accent-d:#000;}

  button,input{font:inherit;color:inherit}

  .brand i{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--up) 50%,var(--down) 50%)}
  .brand small{font-weight:600;color:var(--sub);font-size:14px}
  .tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px;max-width:100%;overflow-x:auto}
  .tab{padding:7px 12px;border-radius:9px;font-size:14px;font-weight:700;color:var(--sub);white-space:nowrap}
  .tab:hover{background:var(--soft)}
  .tab .n{font-weight:600;font-size:12.5px;margin-left:4px;opacity:.75}
  .tab[aria-selected="true"]{background:var(--ink);color:#fff}
  .tab[data-c="0"][aria-selected="true"]{background:var(--up)}
  .tab[data-c="1"][aria-selected="true"]{background:var(--down)}

  .tools{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:20px 0 14px}

  button.action.main{background:var(--ink);border-color:var(--ink);color:#fff}
  button.action.main:hover{background:#000}
  button.action.copied{background:var(--up);border-color:var(--up);color:#fff}
  .status{font-size:13.5px;color:var(--sub);padding-bottom:12px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding-bottom:60px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .card:hover{border-color:var(--ink)}

</style>

</div>

<script>
  const grid = document.getElementById('grid');
  const statusLine = document.getElementById('statusLine');
  const searchBox = document.getElementById('searchBox');
  const promptBtn = document.getElementById('promptBtn');
  const copyAllBtn = document.getElementById('copyAllBtn');

  let allFiles = [];
  let filteredFiles = [];
  const TAB_LABEL = { '기타': '둘이 함께' };   // 화면에 보이는 탭 이름 (기타 → 둘이 함께)
  const tabLabel = n => TAB_LABEL[n] || n;
  let currentTab = (new URLSearchParams(location.search).get('c') || decodeURIComponent(location.hash.slice(1)) || '').trim();
  if (currentTab === '함께' || currentTab === '둘이 함께') currentTab = '기타';
  if (currentTab !== '전체' && currentTab !== '기타' && !CHARACTERS.includes(currentTab)) currentTab = CHARACTERS[0];
  const IMG_EXT = ['.png', '.jpg', '.jpeg', '.webp', '.gif'];
  const isImage = n => IMG_EXT.some(e => n.toLowerCase().endsWith(e));
  const stripExt = n => n.replace(/\.[^.]+$/, '');

  const rawUrl = f => encodeURI(IMAGE_BASE) + encodeURIComponent(f.name);
  const pagesBase = IMAGE_BASE;

  // 공백·괄호·중괄호 등 깨질 수 있는 문자만 %XX 로 바꿉니다. ({user} 같은 글자는 크랙이 이름으로 바꿔 버립니다)
  const safeName = s => s.replace(/[ %#?()\[\]{}]/g, c => '%' + c.charCodeAt(0).toString(16).toUpperCase());
  const altText = n => stripExt(n).replace(/[\[\]]/g, '');
  const markdownCode = f => `![${altText(f.name)}](${pagesBase}${safeName(f.name)})`;

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
      ta.remove(); return ok;
    }
  }
  function flash(btn, msg, orig) {
    btn.textContent = msg; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1400);
  }

  // 프롬프트용 목록: 출력 형식 한 줄 + 앞 문구(분류)별로 묶은 이름 목록
  function promptText(list) {
    const fmt = `이미지 출력법: ![이름](${pagesBase}파일이름) 형식으로 출력. 파일이름은 아래 [분류] 줄의 앞 문구를 붙이고 .png 를 붙여 완성하고, %20 등의 표기는 글자 하나도 바꾸지 않는다.`;
    const groups = {};
    list.forEach(f => { (groups[f.prefix] = groups[f.prefix] || []).push(f); });
    const order = [...CHARACTERS, ...Object.keys(groups).filter(k => !CHARACTERS.includes(k))];
    const lines = [fmt];
    order.filter(k => groups[k]).forEach(k => {
      const arr = groups[k];
      if (k) {
        lines.push(`[${k}] 앞에 ${k}_ 를 붙임`);
        lines.push(arr.map(f => safeName(f.rest)).join(','));
      } else {
        lines.push('[앞 문구 없음]');
        lines.push(arr.map(f => safeName(stripExt(f.name))).join(','));
      }
    });
    return lines.join('\n');
  }

  function renderTabs() {
    const box = document.getElementById('tabs');
    box.innerHTML = '';
    [...CHARACTERS, '기타', '전체'].forEach(name => {
      const n = name === '전체' ? allFiles.length : allFiles.filter(f => f.tab === name).length;
      const b = document.createElement('button');
      b.className = 'tab';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', name === currentTab ? 'true' : 'false');
      const ci = CHARACTERS.indexOf(name); if (ci >= 0) b.dataset.c = ci;
      b.appendChild(document.createTextNode(tabLabel(name)));
      const c = document.createElement('span'); c.className = 'n'; c.textContent = n; b.appendChild(c);
      b.addEventListener('click', () => {
        currentTab = name; renderTabs(); applyFilter();
        try { history.replaceState(null, '', '?c=' + encodeURIComponent(name)); } catch (e) {}
      });
      box.appendChild(b);
    });
  }

  function render(list) {
    grid.innerHTML = '';
    if (!list.length) { grid.innerHTML = '<div class="empty">표시할 이미지가 없습니다.</div>'; return; }
    list.forEach((file, idx) => {
      const card = document.createElement('div'); card.className = 'card';
      const tw = document.createElement('div'); tw.className = 'thumb-wrap';
      const img = document.createElement('img'); img.src = rawUrl(file); img.loading = 'lazy'; img.alt = file.name;
      tw.appendChild(img); tw.addEventListener('click', () => openLightbox(idx, tw));
      const nm = document.createElement('div'); nm.className = 'card-name';
      const ci = CHARACTERS.indexOf(file.prefix);
      const dot = document.createElement('span'); dot.className = 'dot ' + (ci === 0 ? 'su' : ci === 1 ? 'do' : 'duo');
      const nmText = document.createElement('span'); nmText.textContent = (currentTab === '전체' || currentTab === '기타') ? file.prefix + (file.prefix ? '_' : '') + file.label : file.label;
      nm.append(dot, nmText);
      const btn = document.createElement('button'); btn.className = 'copy-btn'; btn.textContent = '이미지 코드 복사';
      btn.addEventListener('click', async () => { if (await copyText(markdownCode(file))) flash(btn, '복사됨!', '이미지 코드 복사'); });
      card.append(tw, nm, btn); grid.appendChild(card);
    });
  }

  function applyFilter() {
    const q = searchBox.value.trim().toLowerCase();
    const pool = currentTab === '전체' ? allFiles : allFiles.filter(f => f.tab === currentTab);
    filteredFiles = q ? pool.filter(f => f.name.toLowerCase().includes(q)) : pool.slice();
    document.getElementById('galleryTitle').textContent = tabLabel(currentTab);
    statusLine.textContent = `${filteredFiles.length} / ${pool.length}개`;
    render(filteredFiles);
  }

  searchBox.addEventListener('input', applyFilter);

  promptBtn.addEventListener('click', async () => {
    if (!filteredFiles.length) return;
    const t = promptText(filteredFiles);
    if (await copyText(t)) {
      flash(promptBtn, '복사됨! (' + t.length + '자)', '프롬프트용 전체 복사');
      statusLine.textContent = `${tabLabel(currentTab)} ${filteredFiles.length}개 · 프롬프트용 목록 ${t.length}자 (크랙 캐릭터 프롬프트 한도 2000자)`;
    }
  });
  copyAllBtn.addEventListener('click', async () => {
    if (!filteredFiles.length) return;
    if (await copyText(filteredFiles.map(markdownCode).join('\n'))) flash(copyAllBtn, '복사됨!', '이미지 코드 전체 복사');
  });

  // 크게 보기
  const lightbox = document.getElementById('lightbox'), lbImg = document.getElementById('lbImg'),
        lbName = document.getElementById('lbName'), lbCount = document.getElementById('lbCount'), lbCopy = document.getElementById('lbCopy');
  let lbIndex = -1, lbOpener = null;
  function showLightbox(i) {
    if (!filteredFiles.length) return;
    lbIndex = (i + filteredFiles.length) % filteredFiles.length;
    const f = filteredFiles[lbIndex];
    lbImg.src = rawUrl(f); lbImg.alt = f.name; lbName.textContent = f.prefix ? f.prefix + ' / ' + f.label : f.label;
    lbCount.textContent = (lbIndex + 1) + ' / ' + filteredFiles.length;
    lbCopy.textContent = '이미지 코드 복사'; lbCopy.classList.remove('copied');
  }
  function openLightbox(i, opener) { lbOpener = opener || null; lightbox.hidden = false; document.body.style.overflow = 'hidden'; showLightbox(i); document.getElementById('lbClose').focus(); }
  function closeLightbox() { lightbox.hidden = true; lbImg.removeAttribute('src'); document.body.style.overflow = ''; if (lbOpener && lbOpener.focus) lbOpener.focus(); }
  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbPrev').addEventListener('click', () => showLightbox(lbIndex - 1));
  document.getElementById('lbNext').addEventListener('click', () => showLightbox(lbIndex + 1));
  lightbox.addEventListener('click', e => { if (e.target === lightbox || e.target.id === 'lbStage') closeLightbox(); });
  lbCopy.addEventListener('click', async () => { const f = filteredFiles[lbIndex]; if (f && await copyText(markdownCode(f))) flash(lbCopy, '복사됨!', '이미지 코드 복사'); });
  document.addEventListener('keydown', e => {
    if (lightbox.hidden) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') showLightbox(lbIndex - 1);
    else if (e.key === 'ArrowRight') showLightbox(lbIndex + 1);
  });
  let touchX = null;
  lightbox.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
  lightbox.addEventListener('touchend', e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX; touchX = null;
    if (Math.abs(dx) > 60) showLightbox(lbIndex + (dx < 0 ? 1 : -1));
  });

  function loadFiles() {
    allFiles = FILES.filter(isImage)
      .map(name => {
        const base = stripExt(name), k = base.indexOf('_');
        const prefix = k > 0 ? base.slice(0, k).trim() : '';
        const rest = k > 0 ? base.slice(k + 1) : base;
        const own = CHARACTERS.includes(prefix);
        return { name, prefix, rest, label: rest, tab: own ? prefix : '기타' };
      })
      .sort((a, b) => a.name.localeCompare(b.name, 'ko', { numeric: true }));
    renderTabs();
    applyFilter();
  }

  document.title = TITLE + " 이미지 갤러리";
  document.getElementById('brandName').textContent = BRAND;
  if (SITE_URL) document.getElementById('home').href = SITE_URL;
  renderTabs();
  loadFiles();
</script>
</body>
</html>
